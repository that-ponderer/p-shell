include ${ThemePath}/Theme/kitty.conf

# Fonts:
font_family      JetBrainsMono Nerd Font
font_size 12.0

# Cursor:
cursor_shape block
shell_integration no-cursor
cursor_trail 200
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
touch_scroll_multiplier 4

enable_audio_bell no

# Layout:
enabled_layouts splits
map alt+s launch --location=hsplit
map alt+v launch --location=vsplit

map alt+shift+k move_window up
map alt+shift+h move_window left
map alt+shift+l move_window right
map alt+shift+j move_window down

map alt+h neighboring_window left
map alt+l neighboring_window right
map alt+k neighboring_window up
map alt+j neighboring_window down

# Window:
window_padding_width 20
confirm_os_window_close 0
background_opacity 0.7
background_blur 7
dynamic_background_opacity yes

# Misc
shell .
allow_remote_control yes
tab_bar_style powerline

# Other binds
map alt+shift+u scroll_page_up
map alt+shift+d scroll_page_down
map alt+t new_tab
map alt+n next_tab
map alt+p previous_tab
map alt+c close_window
map alt+shift+c close_tab

